name: Pipeline checks
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install project and tested ML backends
        run: python -m pip install -e . lightgbm==4.6.0 catboost==1.2.8
      - run: python -m unittest discover -v
      - run: python scripts/package_solution.py
      - uses: actions/upload-artifact@v4
        with:
          name: mlmom-solution
          path: dist/mlmom-solution.zip
