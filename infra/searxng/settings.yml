use_default_settings: true

general:
  debug: false
  instance_name: "MLmom local search"

search:
  safe_search: 1
  formats:
    - html
    - json

server:
  bind_address: "0.0.0.0"
  port: 8080
  # Localhost-only development key. Replace it before exposing the service.
  secret_key: "mlmom-local-only-not-for-public-deployment"
  limiter: false
  image_proxy: false
